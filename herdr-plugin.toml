# worktender — git worktrees as herdr workspaces.
#
# Install with `herdr plugin install steig/worktender`, or for local development
# `herdr plugin link .` from a checkout.

id = "steig.worktender"
name = "worktender"
version = "0.9.1"
min_herdr_version = "0.7.5"
# This is the marketplace listing copy, and for most people the only sentence
# they will read. `start` creates a worktree, and it is the only thing here that
# does: the reconcile commands still adopt what they find rather than making
# any, so "start work on an issue" and "adopt" are named separately.
description = "One command from a GitHub issue to a coding agent working on it in its own worktree."
platforms = ["linux", "macos", "windows"]

# Build the binary at install time. herdr runs this once, after the install is
# confirmed and before the plugin is registered.
#
# Unix: the script prefers a local Go toolchain and falls back to downloading a
# prebuilt release binary, so installing works with or without Go.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/build.sh"]

# Windows has no POSIX `sh`, so build straight from source. Installing on
# Windows therefore needs Go on PATH.
[[build]]
platforms = ["windows"]
command = ["go", "build", "-o", "bin/worktender.exe", "."]

# Every entry point is declared twice — a unix entry and a windows twin — because
# herdr requires a unique id per action and the two platforms need different
# commands. The windows command goes through powershell rather than invoking
# .\bin\worktender.exe directly: herdr sets the child's cwd to the plugin root, but
# CreateProcessW resolves a relative application path against herdr's own cwd, so
# the bare relative path fails. powershell's `&` resolves it from the right place.

# ls — list every worktree in the current repository with the herdr workspace and
# agent status attached. Output lands in `herdr plugin log list --plugin steig.worktender`.
[[actions]]
id = "ls"
title = "Worktender: list worktrees"
platforms = ["linux", "macos"]
command = ["./bin/worktender", "ls"]

[[actions]]
id = "ls-windows"
title = "Worktender: list worktrees"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", "& .\\bin\\worktender.exe ls"]

# sync — adopt every worktree herdr has no workspace for, and staff every
# workspace sitting there as a bare shell. Both are non-destructive, so they act
# directly. Finished worktrees are only LISTED: a plugin action has no prompt
# surface, so there is no confirmation step and pruning never happens here.
[[actions]]
id = "sync"
title = "Worktender: sync worktrees"
platforms = ["linux", "macos"]
command = ["./bin/worktender", "sync"]

[[actions]]
id = "sync-windows"
title = "Worktender: sync worktrees"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", "& .\\bin\\worktender.exe sync"]

# prune — the safe half: reports which worktrees look finished and why, and
# which were spared and why, without touching anything. This is the action to
# reach for; prune-apply below is the deliberate second step.
[[actions]]
id = "prune"
title = "Worktender: prune (list)"
platforms = ["linux", "macos"]
command = ["./bin/worktender", "prune"]

[[actions]]
id = "prune-windows"
title = "Worktender: prune (list)"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", "& .\\bin\\worktender.exe prune"]

# prune-apply — the destructive twin of `prune`, kept as its own action so that
# removing worktrees is always a deliberate choice and never something a stray
# keybinding can reach. Guards are re-checked at execution time, so anything
# that gained uncommitted work or an agent since the plan is skipped and said so.
[[actions]]
id = "prune-apply"
title = "Worktender: prune (apply)"
platforms = ["linux", "macos"]
command = ["./bin/worktender", "prune-apply"]

[[actions]]
id = "prune-apply-windows"
title = "Worktender: prune (apply)"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", "& .\\bin\\worktender.exe prune-apply"]

# Startup — the one-shot herdr runs after the server is ready.
#
# This is what replaces the zsh original's `wt watch`, a 90s loop that asked the
# GitHub API about every worktree on every cycle. There is no loop here and no
# resident process: one adopt-and-staff pass per repository herdr has a worktree
# workspace open for, and then the command exits.
#
# The division of labour with [[events]] is the whole design. Events cover the
# session; they cannot cover the interval when herdr was not running, which is
# where a worktree added from a plain shell or a workspace restored without its
# agent comes from. That gap opens once, at startup.
#
# Like the event hooks, this does nothing unless WORKTENDER_EVENTS is set — the
# same opt-in, because it is the same autonomous act of starting coding agents,
# fired across every open repository at once.
[[startup]]
platforms = ["linux", "macos"]
command = ["./bin/worktender", "startup"]

[[startup]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", "& .\\bin\\worktender.exe startup"]

# Events — the live half. herdr invokes these when worktrees appear, so a new
# checkout is adopted and staffed as it happens rather than the next time
# someone remembers to run `sync`.
#
# THESE DO NOTHING UNLESS WORKTENDER_EVENTS IS SET. The handler checks that before
# it even parses the event, so an un-opted-in install runs a process that exits
# immediately and says why. That default is deliberate: these hooks start coding
# agents, and a plugin that begins spawning agents the moment it is installed has
# handed its user an autonomous trigger they never asked for.
#
# Every hook runs the same `on-event` entry point, because the handler does not
# act on what the event says — it reads it for one thing, which repository, and
# then runs the same whole-repository pass `sync` runs. An event is a trigger,
# never a fact.
#
# The `on` names are DOTTED. The underscored spellings that appear inside the
# payload (worktree_opened) are a different namespace, and a hook declared with
# one of those parses fine and never fires.
#
# pane.agent_status_changed is deliberately absent. A hook has no filter, so
# every match spawns a process, and that event fires on each idle/working
# transition on every pane in the session.
#
# The completion gate was expected to want it and turned out not to. A hook is
# fire-and-forget — herdr starts a process, the process exits, and nobody is
# waiting on its exit code — while a gate is a caller BLOCKING until a condition
# holds. The gate therefore subscribes over the socket, for the panes it was
# given, for as long as it waits, and this file needs no entry for it.
#
# `gate`, `report` and `start` are not registered as actions, and cannot be. A
# herdr action is a fixed command array with no argument surface, and each of the
# three is nothing without its arguments: an action could only ever wait on one
# hard-coded target, file one hard-coded status, or start one hard-coded issue.
#
# The consequence for `start` is that it never receives HERDR_PLUGIN_CONTEXT_JSON,
# which herdr injects only when it is the one invoking — so the repository it
# creates a checkout in has to come from `--repo`, the way it does on `prune`.
# There is no path by which the context arrives, so there is no fallback to add.
#
# For `gate` there is a second reason, and it is worse. An action's output lands in
# `herdr plugin log list` after it finishes, so a registered gate would block for
# up to fifteen minutes and then deliver its answer somewhere its caller is not
# looking, having never returned an exit code to anyone. `gate` is a command a
# coordinating agent runs and waits on.

# A worktree herdr just created: adopt it and staff it.
[[events]]
on = "worktree.created"
platforms = ["linux", "macos"]
command = ["./bin/worktender", "on-event"]

[[events]]
on = "worktree.created"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", "& .\\bin\\worktender.exe on-event"]

# An existing checkout that just gained a workspace, and so now wants staffing.
[[events]]
on = "worktree.opened"
platforms = ["linux", "macos"]
command = ["./bin/worktender", "on-event"]

[[events]]
on = "worktree.opened"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", "& .\\bin\\worktender.exe on-event"]

# NOT subscribed: pane.agent_detected, whose release half would say "a worktree
# whose agent has gone is unstaffed again". Three reasons it stays unsubscribed.
#
# It cannot name a repository. The payload carries a workspace_id and a pane_id
# and no checkout, so every firing would have to ask herdr which repository it
# meant before it could decide there was nothing to do — on a hook that fires
# for every pane in the session, most of them nothing to do with a worktree.
# There is no filter field on [[events]], so the attach half cannot be declined.
#
# It fires on its own output. Staffing starts an agent, herdr detects it, the
# hook fires, and a whole-repository reconcile runs to conclude that the agent
# it just started is there. Every staff would cost a second pass.
#
# And re-staffing on release is the wrong behaviour to want. An agent is
# released when it finished or when someone stopped it; restarting one within
# the second, unasked, is the autonomous trigger WORKTENDER_EVENTS exists to keep
# behind an opt-in — inside the opt-in, where it cannot be argued with. A
# worktree left unstaffed mid-session is picked up by the next `sync` or the
# next startup pass, which is a human deciding to restaff, which is the point.
