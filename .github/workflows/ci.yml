name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The suite drives real git in a temp directory, so it needs a git that
    # supports worktrees and a writable TMPDIR — both are standard on the
    # hosted runners. macOS is here because TMPDIR lives under a symlink there
    # and several path guards exist only because of it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # There are no external dependencies and so no go.sum, which the
          # module cache treats as a missing lockfile and warns about.
          cache: false

      - name: git identity
        # Tests commit in throwaway repositories; git refuses without one.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        # -count=1 defeats the test cache, so a green run means the tests
        # actually executed.
        run: go test -count=1 ./...

  mod:
    # mods/worktender-watch is a Claude Code mod: TypeScript the engine loads
    # itself, so it is checked by the engine rather than by a toolchain of its
    # own. Neither command needs a login. The version is pinned because the
    # mod API is early access and may change between releases; move it on
    # deliberately, with the tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: claude code
        run: npm install -g @anthropic-ai/claude-code@2.1.296

      - name: validate
        run: claude plugin validate . && claude plugin validate mods/worktender-watch

      - name: test
        run: claude plugin test mods/worktender-watch
